<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#141719">
    <meta name="description" content="Toyota Supra A80 на горной дороге. Интерактивная автомобильная съёмка в 3D.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Toyota Supra A80">
    <meta property="og:description" content="Красная Supra на альпийской дороге. Поверните камеру или отправьте машину в сальто.">
    <meta property="og:image" content="https://iamnhuman.github.io/toyota-astra-6.2/preview.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="640">
    <meta property="og:image:height" content="360">
    <meta property="og:image:alt" content="Красная Toyota Supra A80 на альпийской дороге">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:,">
    <link rel="license" href="./CREDITS.txt">
    <!-- Model: TOYOTA SUPRA MK4 (A80) by temich, CC BY-NC 4.0.
         https://sketchfab.com/3d-models/toyota-supra-mk4-a80-61d402d6de904374bfe5a98907c85b1d
         https://creativecommons.org/licenses/by-nc/4.0/
         Adapted paint, windows, plates and wheels. Added driver, cabin details and rear wing.
         Alps Field by Andreas Mischok. Asphalt 04 by Sergej Majboroda and Jenelle van Heerden.
         Concrete Wall 006 and Aerial Grass Rock by Poly Haven. High-res tree textures by rubberduck. -->
    <title>Toyota Supra A80</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <main id="drive" aria-label="Toyota Supra A80 на горной дороге">
      <picture id="still"><source media="(orientation: portrait)" srcset="/light/supra-portrait.webp"><img src="/light/supra.webp" alt="" fetchpriority="high"></picture>
      <canvas id="road" tabindex="0" aria-label="Движущаяся Toyota Supra. Потяните, чтобы повернуть камеру. Колесо или жест двумя пальцами приближает выбранную деталь. Клавиши 1, 2 и 3 выбирают ракурс, пробел ставит на паузу."></canvas>
      <div id="loading" role="status"><span id="message">Загрузка сцены…</span><progress aria-label="Загрузка сцены"></progress><button hidden id="retry" type="button">Повторить</button></div>
      <footer id="controls" inert>
        <div class="car-name"><h1>Toyota Supra <small>A80</small></h1><span id="speed">0 км/ч</span><span id="trick-name" role="status"></span></div>
        <div class="actions" role="group" aria-label="Управление сценой">
          <button id="play" type="button" aria-label="Пауза" title="Пауза (пробел)"><svg viewBox="0 0 24 24"><use href="#pause-icon"></use></svg></button>
          <button id="shot" type="button" title="Включить облёт камеры (C)" aria-label="Автоматический облёт камеры" aria-pressed="false" aria-keyshortcuts="C"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#camera-icon"></use></svg><span id="shot-name">Облёт</span></button>
          <button id="hd" type="button" aria-label="HD и студийный свет" aria-pressed="false" aria-keyshortcuts="Q" title="Включить HD и студийный свет (Q)"><span>HD</span></button>
          <button id="smoke" type="button" aria-pressed="false" aria-keyshortcuts="S" title="Включить дым (S)"><span class="switch-track" aria-hidden="true"></span>Дым</button>
          <button id="flip" type="button" aria-keyshortcuts="J" title="Каждое нажатие запускает следующий трюк (J)"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#flip-icon"></use></svg>Сальто</button>
        </div>
      </footer>
    </main>
    <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="pause-icon" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3.5"/></symbol>
      <symbol id="play-icon" viewBox="0 0 24 24"><path d="m7 4 13 8-13 8Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="camera-icon" viewBox="0 0 24 24"><path d="M3 7.5h4l1.7-3h6.6l1.7 3h4v12H3z"/><circle cx="12" cy="13" r="3.2"/></symbol>
      <symbol id="flip-icon" viewBox="0 0 24 24"><path d="M4 12a7.4 7.4 0 1 1 5 6.9M4 7v5h5M3 21h18"/></symbol>
    </svg>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
